name: Sync Upstream Code

on:
  schedule:
    - cron: '0 * * * *' # हर 1 घंटे में ऑटो-सिंक
  workflow_dispatch:      # मैन्युअल बटन

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream code & configs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/nullcpy/rvb.git || git remote set-url upstream https://github.com/nullcpy/rvb.git
          git fetch upstream main
          git checkout main

          # 1. ओरिजिनल Repo से सारे नए कोड, ऐप्स और पैचेज लाएगा
          git checkout upstream/main -- .

          # 2. Python Script चलाकर फोटो वाले चारों ख़राब आइटम्स को तुरंत मिटाएगा
          python3 scripts/clean-readme.py || true

          # 3. Workflows फ़ोल्डर को सुरक्षित रखेगा
          git checkout HEAD -- .github/workflows/ || true

          # 4. कमिट और पुश करेगा
          git commit -m "Sync upstream code & auto clean README [skip ci]" || true
          git push origin main
