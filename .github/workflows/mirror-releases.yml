name: Mirror Releases from Original Repo

on:
  schedule:
    - cron: '0 */6 * * *' # हर 6 घंटे में ऑटो-चेक और ऑटो-रिपेयर करेगा
  workflow_dispatch:      # मैन्युअल बटन

permissions:
  contents: write

jobs:
  mirror-and-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Audit Mismatches & Mirror Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, subprocess, os, time, re

          orig_repo = "nullcpy/rvb"
          my_repo = "${{ github.repository }}"

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req) as res:
                      return json.loads(res.read().decode())
              except Exception as e:
                  print(f"Error fetching {url}: {e}")
                  return []

          print("🔍 Fetching releases from original repo and local repo...")
          
          # 1. दोनों Repos से रिलीज़ेस का डेटा लाएगा
          orig_releases = get_json(f"https://api.github.com/repos/{orig_repo}/releases?per_page=30")
          my_releases = get_json(f"https://api.github.com/repos/{my_repo}/releases?per_page=30")

          if not orig_releases:
              print("Failed to fetch original releases.")
              exit(1)

          my_rel_map = {}
          if isinstance(my_releases, list):
              for r in my_releases:
                  tag = r.get('tag_name')
                  if tag:
                      my_rel_map[tag] = [a['name'] for a in r.get('assets', [])]

          # पुराने से नए के क्रम में प्रोसेस करेगा
          for rel in reversed(orig_releases):
              tag = rel['tag_name']
              title = rel.get('name') or tag
              body = rel.get('body') or ""
              is_prerelease = rel.get('prerelease', False)
              orig_assets = sorted([a['name'] for a in rel.get('assets', [])])

              mismatch_detected = False

              # अगर यह टैग आपकी Repo में पहले से है, तो फाइलों का मिलान करेगा
              if tag in my_rel_map:
                  local_assets = sorted(my_rel_map[tag])
                  if orig_assets != local_assets:
                      print(f"⚠️ MISMATCH DETECTED in Tag: {tag}!")
                      print(f"   Original Assets ({len(orig_assets)}): {orig_assets}")
                      print(f"   Local Assets    ({len(local_assets)}): {local_assets}")
                      print(f"   action: Auto-Deleting mismatched local release {tag}...")
                      
                      # मिसमैच वाले रिलीज़ और टैग को डिलीट करेगा
                      subprocess.run(["gh", "release", "delete", tag, "-y", "--cleanup-tag"], check=False)
                      subprocess.run(["git", "push", "--delete", "origin", tag], check=False)
                      mismatch_detected = True
                      time.sleep(2)
                  else:
                      print(f"✓ Tag {tag} matches 100% perfectly. Skipping.")
                      continue

              print(f"🚀 Mirroring/Repairing Release: {tag} ({title})...")

              # Description क्लीनिंग (Group/Donate हटाएगा, m4mental लिंक्स लगाएगा)
              clean_body = re.sub(r'\[GitHub\]\([^)]+\)', r'[GitHub](https://github.com/m4mental/my-rvb-builder)', body)
              clean_body = re.sub(r'\[Website\]\([^)]+\)', r'[Website](https://m4mental.github.io/my-rvb-builder/)', clean_body)
              clean_body = re.sub(r'\|[ \t]*\[Group\]\([^)]+\)', '', clean_body)
              clean_body = re.sub(r'\|[ \t]*\[Donate\]\([^)]+\)', '', clean_body)

              rm_dir = f"./tmp_assets_{tag}"
              os.makedirs(rm_dir, exist_ok=True)

              # ओरिजिनल Repo से सही फाइलें डाउनलोड करेगा
              for asset in rel.get('assets', []):
                  dl_url = asset['browser_download_url']
                  fname = asset['name']
                  print(f"   📥 Downloading {fname}...")
                  subprocess.run(["curl", "-sL", dl_url, "-o", f"{rm_dir}/{fname}"], check=False)

              # आपकी Repo में 100% मैचिंग फ़ाइलों के साथ नया रिलीज़ बनाएगा
              cmd = ["gh", "release", "create", tag]
              for fname in os.listdir(rm_dir):
                  cmd.append(f"{rm_dir}/{fname}")

              cmd.extend(["--title", title, "--notes", clean_body])
              if is_prerelease:
                  cmd.append("--prerelease")

              print(f"   📤 Uploading corrected release {tag} to your repo...")
              subprocess.run(cmd, check=False)

              # सफाई
              subprocess.run(["rm", "-rf", rm_dir], check=False)
              print(f"✓ Tag {tag} successfully mirrored & verified!")
              time.sleep(2)

          print("🎉 All releases audited and repaired successfully!")
          EOF
