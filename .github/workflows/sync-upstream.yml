name: Sync Upstream Code

on:
  schedule:
    - cron: '0 * * * *' # हर 1 घंटे में ऑटो-सिंक
  workflow_dispatch:      # मैन्युअल बटन

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/nullcpy/rvb.git || git remote set-url upstream https://github.com/nullcpy/rvb.git
          git fetch upstream main
          git checkout main

          # 1. ओरिजिनल Repo से सारे नए ऐप्स और कोड लाएगा
          git checkout upstream/main -- .

      - name: Clean README using Python Heredoc
        run: |
          python3 << 'EOF'
          import re, os

          path = "README.md"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  c = f.read()

              # 1. Remove Palestine Banner
              c = re.sub(r'<div align="center"><a href="https://github.com/Safouene1/support-palestine-banner[\s\S]*?</div>\s*', '', c)

              # 2. Remove Telegram Group, Channel, Donate badges
              c = re.sub(r'<a href="https://t.me/[^"]*"><img src="[^"]*badge/Group-[^"]*"></a>\s*', '', c)
              c = re.sub(r'<a href="https://t.me/[^"]*"><img src="[^"]*badge/Channel-[^"]*"></a>\s*', '', c)
              c = re.sub(r'<a href="[^"]*donate[^"]*"><img src="[^"]*badge/Donate-[^"]*"></a>\s*', '', c)

              # 3. Remove Support the Project section
              c = re.sub(r'## 🤝 Support the Project[\s\S]*?(?=---|\Z)', '', c)

              # 4. Remove Telegram references
              c = re.sub(r'or \*\*\[send a message in our Telegram Group\]\([^)]+\)\*\*', '', c)
              c = re.sub(r'\*\*\[Send a message in our Telegram Group\]\([^)]+\)\*\* or ', '', c)

              # 5. Replace links with m4mental links
              c = c.replace("https://github.com/nullcpy/rvb", "https://github.com/m4mental/my-rvb-builder")
              c = c.replace("https://nullcpy.github.io/", "https://m4mental.github.io/my-rvb-builder/")
              c = c.replace("https://nullcpy.github.io", "https://m4mental.github.io/my-rvb-builder")

              # 6. Clean blank lines
              c = re.sub(r'\n{3,}', '\n\n', c)

              with open(path, "w", encoding="utf-8") as f:
                  f.write(c)

              print("==============================================")
              print("SUCCESS: README.md cleaned for m4mental!")
              print("==============================================")
          EOF

      - name: Commit and Push Cleaned README & Upstream Code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/ || true
          git commit -m "Sync upstream code & clean README [skip ci]" || true
          git push origin main
