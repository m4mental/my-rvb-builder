name: Sync & Deploy Website

on:
  workflow_call:          # Pipeline Controller invocation
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  sync-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Sync, Brand & Deploy M4Mental Hub Website with High-Speed P2P Engine
        env:
          PAT_TOKEN: ${{ secrets.AUTO_SYNC_PAT || secrets.GH_PAT || secrets.PAT || secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "⚠️ PAT Token secret (AUTO_SYNC_PAT / GH_PAT) not set. Skipping website sync."
            exit 0
          fi

          echo "📥 Cloning official website upstream repository (nullcpy.github.io)..."
          rm -rf ./tmp_site ./site_repo
          mkdir -p ./tmp_site
          git clone https://github.com/nullcpy/nullcpy.github.io.git ./tmp_site

          # Run Website branding & P2P injection engine
          python3 .github/scripts/sync_website.py

          echo "🚀 Deploying to m4mental.github.io..."
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/m4mental/m4mental.github.io.git" site_repo || {
            mkdir -p site_repo
            cd site_repo
            git init
            git remote add origin "https://x-access-token:${PAT_TOKEN}@github.com/m4mental/m4mental.github.io.git"
            cd ..
          }

          # Copy processed files to site repo
          cp -rf ./tmp_site/* ./site_repo/
          touch ./site_repo/.nojekyll

          cd site_repo
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B main || true
          git add -A
          git diff-index --quiet HEAD || git commit -m "Deploy M4Mental Hub with Warp Drop P2P Engine [skip ci]"
          git push -u origin main --force || git push -u origin master --force
          cd ..
          rm -rf ./tmp_site ./site_repo
          echo "✅ m4mental.github.io deployment complete!"
