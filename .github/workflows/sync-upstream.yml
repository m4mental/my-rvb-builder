name: Sync Upstream Code

on:
  workflow_call:          # Pipeline Controller invocation
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream code (main branch)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/nullcpy/rvb.git || git remote set-url upstream https://github.com/nullcpy/rvb.git
          git fetch upstream main

          # Fetch latest upstream files & README
          git checkout upstream/main -- .

          # Preserve customized workflows and scripts
          git checkout HEAD -- .github/workflows/ || true
          git checkout HEAD -- .github/scripts/ || true

      - name: Auto-Transform README.md to M4Mental Hub
        run: |
          python3 .github/scripts/brand_readme.py

      - name: Commit and Push Cleaned README & Upstream Code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-sync upstream code & transform README to M4Mental Hub [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main || true
