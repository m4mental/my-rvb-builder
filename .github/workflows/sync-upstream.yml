name: Sync Upstream Code

on:
  schedule:
    - cron: '0 */12 * * *' # हर 12 घंटे में ऑटोमैटिक सिंक
  workflow_dispatch:      # यह लाइन आपको manual button देती है

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with original repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Upstream remote सेट करें
          git remote add upstream https://github.com/nullcpy/rvb.git || git remote set-url upstream https://github.com/nullcpy/rvb.git
          git fetch upstream
          git checkout main
          # ओरिजिनल repo के कोड को merge करें
          git merge upstream/main --no-edit || git merge --strategy-option theirs upstream/main
          git push origin main
