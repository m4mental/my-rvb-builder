name: Sync & Deploy Website

on:
  workflow_call:          # Pipeline Controller invocation
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  sync-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync, Brand & Deploy M4Mental Hub Website with High-Speed P2P Engine
        env:
          PAT_TOKEN: ${{ secrets.AUTO_SYNC_PAT }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "⚠️ AUTO_SYNC_PAT secret not set. Skipping website deployment."
            exit 0
          fi

          echo "📥 Cloning official website upstream repository (nullcpy.github.io)..."
          mkdir -p ./tmp_site
          git clone https://github.com/nullcpy/nullcpy.github.io.git ./tmp_site

          # Run Website branding & P2P injection engine
          python3 .github/scripts/sync_website.py

          # Clone and Push to Dedicated Website Repo (m4mental.github.io)
          echo "🚀 Deploying to m4mental.github.io..."
          git clone https://m4mental:${PAT_TOKEN}@github.com/m4mental/m4mental.github.io.git site_repo
          
          rsync -av --exclude='.git' ./tmp_site/ ./site_repo/

          cd site_repo
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Deploy M4Mental Hub with Warp Drop P2P Engine [skip ci]" || true
          git push origin main
          cd ..
          rm -rf ./tmp_site ./site_repo
