name: Sync Upstream Code

on:
  schedule:
    - cron: '0 * * * *' # हर 1 घंटे में ऑटोमैटिक सिंक
  workflow_dispatch:      # मैन्युअल बटन

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with original repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/nullcpy/rvb.git || git remote set-url upstream https://github.com/nullcpy/rvb.git
          git fetch upstream main
          git checkout main
          # Upstream से नया कोड और कॉन्फ़िग्स मर्ज करेगा
          git merge upstream/main -X theirs --no-edit || (git merge --abort && git checkout upstream/main -- . && git commit -m "Auto resolve conflict" || true)
          # Workflow Restrictions से बचने के लिए लोकल वर्कफ़्लो सुरक्षित रखेगा
          git checkout HEAD -- .github/workflows/ || true
          git commit -m "Sync upstream code and configs" || true
          git push origin main
