name: Clear Old Numbered Releases & Drafts

on:
  workflow_dispatch:      # Manual trigger button

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Delete Old Numbered Releases (Protect Permanent Stable & Beta Archives)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/clear_releases.py
