name: Sync Upstream Code

on:
  schedule:
    - cron: '0 * * * *' # हर 1 घंटे में ऑटोमैटिक रन
  workflow_dispatch:      # मैन्युअल रन बटन

permissions:
  contents: write
  workflows: write        # YML वर्कफ़्लो फ़ाइलों को अपडेट करने की अनुमति

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with original repo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/nullcpy/rvb.git || git remote set-url upstream https://github.com/nullcpy/rvb.git
          git fetch upstream main
          git checkout main
          # Conflict आने पर ऑटोमैटिक Upstream के कोड को प्रायोरिटी देगा
          git merge upstream/main -X theirs --no-edit || (git merge --abort && git checkout upstream/main -- . && git commit -m "Auto resolve conflict" || true)
          git push origin main
