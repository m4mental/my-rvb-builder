name: Clear All Old Releases & Drafts

on:
  workflow_dispatch:      # केवल मैन्युअल रन बटन

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Delete ALL Drafts and Releases via Paginated Python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import subprocess, json

          repo = "${{ github.repository }}"
          print(f"Fetching ALL paginated releases and drafts for {repo}...")

          try:
              # --paginate सभी पेजों के ड्राफ़्ट्स को एक साथ खींचकर लाएगा
              cmd = ["gh", "api", "--paginate", f"repos/{repo}/releases"]
              res = subprocess.run(cmd, capture_output=True, text=True, check=True)
              
              # JSON सरणी (Array) पार्स करेगा
              raw_out = res.stdout.strip()
              if not raw_out:
                  print("No releases found.")
                  exit(0)

              # पेजिनेशन रिजल्ट्स को संभालता है
              if raw_out.startswith("["):
                  releases = json.loads(raw_out)
              else:
                  # मल्टीपल JSON सरणियों को जोड़ता है
                  releases = []
                  for line in raw_out.splitlines():
                      if line.strip():
                          releases.extend(json.loads(line.strip()))

              if not releases:
                  print("No releases or drafts found!")
              else:
                  print(f"Total found: {len(releases)} releases/drafts. Deleting now...")
                  for rel in releases:
                      rel_id = rel['id']
                      tag = rel.get('tag_name') or 'Draft'
                      is_draft = rel.get('draft', False)
                      print(f"🗑️ Deleting Release ID: {rel_id} (Tag: {tag}, Draft: {is_draft})")
                      subprocess.run(["gh", "api", "-X", "DELETE", f"repos/{repo}/releases/{rel_id}"], check=False)
                  print("✓ All releases and drafts deleted successfully!")
          except Exception as e:
              print(f"Execution Error: {e}")
          EOF

      - name: Delete All Remote Git Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting all remaining remote git tags..."
          git fetch --tags
          git tag -l | while read -r rtag; do
            if [ -n "$rtag" ]; then
              echo "🗑️ Deleting remote tag: $rtag"
              git push --delete origin "$rtag" || true
            fi
          done
          echo "🎉 100% Cleared All Drafts, Releases & Tags!"
