name: Sync Upstream Code

on:
  workflow_call:          # Pipeline Controller invocation
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream code (main branch)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/nullcpy/rvb.git || git remote set-url upstream https://github.com/nullcpy/rvb.git
          git fetch upstream main
          git checkout main

          # 1. Fetch latest upstream files & README
          git checkout upstream/main -- .

      - name: Auto-Transform README.md to M4Mental Hub
        run: |
          python3 .github/scripts/brand_readme.py

      - name: Commit and Push Cleaned README & Upstream Code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git checkout HEAD -- .github/workflows/ || true
          git commit -m "Auto-sync upstream code & transform README to M4Mental Hub [skip ci]" || true
          git push origin main
