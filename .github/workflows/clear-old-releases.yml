name: Clear All Old Releases

on:
  workflow_dispatch:      # केवल मैन्युअल रन बटन (Manual Run Only)

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete All Releases and Git Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching all releases list..."
          
          # 1. GitHub Releases और उनसे जुड़े Git Tags दोनों को डिलीट करेगा
          gh release list --limit 500 | awk '{print $1}' | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "🗑️ Deleting release and tag: $tag"
              gh release delete "$tag" -y --cleanup-tag || true
            fi
          done

          # 2. बचे हुए किसी भी अन्य Tags को भी पूरी तरह साफ़ करेगा
          echo "Cleaning up any remaining orphan remote tags..."
          git fetch --tags
          git tag -l | while read -r rtag; do
            if [ -n "$rtag" ]; then
              echo "🗑️ Deleting remote tag: $rtag"
              git push --delete origin "$rtag" || true
            fi
          done

          echo "🎉 All old releases and git tags cleared successfully!"
