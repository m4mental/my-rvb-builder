name: Build

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      config_file:
        description: "Select the config file to use"
        required: true
        type: choice
        default: ".github/configs/config.stable.updated.json"
        options:
          - ".github/configs/config.manual.toml"
          - ".github/configs/config.dev.updated.json"
          - ".github/configs/config.stable.updated.json"

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      trawl:
        image: ghcr.io/germondai/trawl:latest
        ports:
          - 8191:8191
        env:
          REDIS_URL: redis://redis:6379
        options: --shm-size=1gb
      cloudflarebypassforscraping:
        image: ghcr.io/sarperavci/cloudflarebypassforscraping:latest
        ports:
         - 8000:8000
    steps:
      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: true

      - name: Resolve build context
        id: context
        run: bash .github/scripts/build_resolve_context.sh "${{ inputs.config_file }}"

      - name: Install Bouncy Castle for BKS Keystore
        run: |
          if yq -o=json eval '.' "${{ steps.context.outputs.CONFIG_FILE }}" | jq -e 'to_entries | any((.value | type == "object") and .value.enabled == true and (.value["cli-source"] | type == "string" and test("npatch|lspatch"; "i")))' >/dev/null; then
            bash .github/scripts/build_install_bouncy_castle.sh
          else
            echo "Skipping Bouncy Castle installation (no enabled Xposed modules found in config)."
          fi

      - name: Resolve version code
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build_resolve_version.sh

      - name: Build modules and apks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          CF_BYPASS_SOLVER_FS_8191_ENABLED: "true"
          CF_BYPASS_SOLVER_CFB_ENABLED: "true"
        run: |
          set -euo pipefail
          ./build.sh "${{ steps.context.outputs.CONFIG_FILE }}"

      - name: Get output
        id: get_output
        run: bash .github/scripts/build_get_output.sh

      - name: Clean release notes for m4mental
        id: clean_notes
        run: |
          LOG='${{ steps.get_output.outputs.BUILD_LOG }}'
          LOG=$(echo "$LOG" | sed -E 's#\[GitHub\]\([^)]+\)#[GitHub](https://github.com/m4mental/my-rvb-builder)#g')
          LOG=$(echo "$LOG" | sed -E 's#\[Website\]\([^)]+\)#[Website](https://m4mental.github.io/my-rvb-builder/)#g')
          LOG=$(echo "$LOG" | sed -E 's#\|[[:space:]]*\[Group\]\([^)]+\)##g')
          LOG=$(echo "$LOG" | sed -E 's#\|[[:space:]]*\[Donate\]\([^)]+\)##g')
          echo "CLEAN_LOG<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update readme with new app versions
        run: |
          python3 scripts/update-readme.py ${{ steps.version.outputs.NEXT_VER_CODE }} "$GITHUB_REPOSITORY" || true

      - name: Clean README using Python Script
        run: |
          python3 scripts/clean-readme.py || true

      - name: Pull latest main before commit
        run: |
          git pull --rebase origin main || true

      - name: Commit updated readme
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          skip_checkout: true
          file_pattern: README.md
          commit_message: "Update README for Build No. ${{ steps.version.outputs.NEXT_VER_CODE }} [skip ci]"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.clean_notes.outputs.CLEAN_LOG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ./build/*
          name: Build No. ${{ steps.version.outputs.NEXT_VER_CODE }}
          tag_name: ${{ steps.version.outputs.NEXT_VER_CODE }}
          overwrite_files: true
          prerelease: ${{ steps.context.outputs.IS_PRERELEASE == 'true' }}

      - name: Notify telegram
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_THREAD_ID: ${{ steps.context.outputs.TG_THREAD_ID }}
          TITLE_SUFFIX: ${{ steps.context.outputs.TITLE_SUFFIX }}
          NEXT_VER_CODE: ${{ steps.version.outputs.NEXT_VER_CODE }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/build_notify_telegram.sh

      - name: Update changelog and module update files
        run: bash .github/scripts/build_update_changelog.sh || true

      - name: Commit updated build and module update files
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: update
          skip_checkout: true
          file_pattern: build.md *-update.json
          commit_message: Bump version ${{ steps.version.outputs.NEXT_VER_CODE }}

      - name: Remove frequently updated apps
        run: |
          git checkout main || true
          bash .github/scripts/build_exclude_from_archive.sh || true

      - name: Upload to release (Archive)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ./build/*
          tag_name: ${{ steps.context.outputs.ARCHIVE_TAG }}
          overwrite_files: true
          target_commitish: main
