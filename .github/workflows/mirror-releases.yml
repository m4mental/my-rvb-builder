name: Mirror Releases from Original Repo

on:
  workflow_dispatch:      # केवल मैन्युअल बटन

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Mirror ALL Releases (No Duplicate Archive Tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Fetching ALL releases from beginning (nullcpy/rvb)..."
          
          P1=$(curl -s "https://api.github.com/repos/nullcpy/rvb/releases?per_page=100&page=1")
          P2=$(curl -s "https://api.github.com/repos/nullcpy/rvb/releases?per_page=100&page=2")
          P3=$(curl -s "https://api.github.com/repos/nullcpy/rvb/releases?per_page=100&page=3")

          RELEASES_JSON=$(jq -s '([.[0][], .[1][], .[2][]] | select(. != null))' <(echo "$P1") <(echo "$P2") <(echo "$P3"))

          if ! echo "$RELEASES_JSON" | jq -e '. | type == "array"' >/dev/null; then
            echo "Failed to fetch releases."
            exit 1
          fi

          TOTAL_COUNT=$(echo "$RELEASES_JSON" | jq 'length')
          echo "Found $TOTAL_COUNT total releases from beginning!"

          # पुराने से नए के क्रम में प्रोसेस करेगा
          echo "$RELEASES_JSON" | jq -c 'reverse | .[]' | while read -r rel; do
            ORIG_TAG=$(echo "$rel" | jq -r '.tag_name')
            ORIG_TITLE=$(echo "$rel" | jq -r '.name // .tag_name')
            BODY=$(echo "$rel" | jq -r '.body // ""')
            PRERELEASE=$(echo "$rel" | jq -r '.prerelease')

            # Beta और Stable आर्काइव की डुप्लिकेट कॉपी बनने से रोकेगा
            if [[ "$ORIG_TAG" == "beta" || "$ORIG_TAG" == "stable" ]]; then
              if gh release view "$ORIG_TAG" >/dev/null 2>&1; then
                echo "✓ Archive release '$ORIG_TAG' already exists. Skipping duplicate."
                continue
              fi
            fi

            TARGET_TAG="$ORIG_TAG"
            TARGET_TITLE="$ORIG_TITLE"

            # केवल नंबर वाले बिल्ड्स (260107 आदि) के लिए ऑटो-इंक्रीमेंट करेगा
            if [[ "$ORIG_TAG" =~ ^[0-9]+$ ]]; then
              NUM=$ORIG_TAG
              while gh release view "$TARGET_TAG" >/dev/null 2>&1; do
                NUM=$((NUM + 1))
                TARGET_TAG="$NUM"
                TARGET_TITLE="Build No. $NUM"
              done
            fi

            # Description से Group/Donate लिंक्स हटाकर आपकी लिंक्स लगाएगा
            CLEAN_BODY=$(echo "$BODY" | sed -E \
              -e 's#\[GitHub\]\([^)]+\)#[GitHub](https://github.com/m4mental/my-rvb-builder)#g' \
              -e 's#\|[[:space:]]*\[Group\]\([^)]+\)##g' \
              -e 's#\|[[:space:]]*\[Donate\]\([^)]+\)##g' \
              -e 's#\[Website\]\([^)]+\)#[Website](https://m4mental.github.io/my-rvb-builder/)#g')

            echo "🚀 Mirroring Release: $TARGET_TAG ($TARGET_TITLE)..."

            RM_DIR="./tmp_assets_$TARGET_TAG"
            mkdir -p "$RM_DIR"

            # फ़ाइलें डाउनलोड करेगा
            echo "$rel" | jq -c '.assets[]' | while read -r asset; do
              DL_URL=$(echo "$asset" | jq -r '.browser_download_url')
              FNAME=$(echo "$asset" | jq -r '.name')
              echo "   📥 Downloading $FNAME..."
              curl -sL "$DL_URL" -o "$RM_DIR/$FNAME"
            done

            # आपकी Repo में रिलीज़ बनाएगा
            if [ -d "$RM_DIR" ] && [ "$(ls -A "$RM_DIR")" ]; then
              echo "   📤 Uploading $TARGET_TAG to your releases..."
              
              PR_FLAG=""
              if [ "$PRERELEASE" = "true" ]; then
                PR_FLAG="--prerelease"
              fi

              gh release create "$TARGET_TAG" "$RM_DIR"/* --title "$TARGET_TITLE" --notes "$CLEAN_BODY" $PR_FLAG || true
            fi

            rm -rf "$RM_DIR"
            echo "✓ Release $TARGET_TAG successfully created!"
            sleep 2
          done

          echo "🎉 All releases mirrored cleanly with no duplicate archives!"
