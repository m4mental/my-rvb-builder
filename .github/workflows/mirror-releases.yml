name: Mirror Releases

on:
  workflow_call:          # Pipeline Controller invocation
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write

jobs:
  mirror-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fast Smart Mirror & Incremental Archive Update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/mirror_releases.py
