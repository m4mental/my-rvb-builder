name: Sync Upstream Code

on:
  schedule:
    - cron: '0 * * * *' # हर 1 घंटे में ऑटोमैटिक रन
  workflow_dispatch:      # मैन्युअल रन बटन

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with original repo (Safely)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/nullcpy/rvb.git || git remote set-url upstream https://github.com/nullcpy/rvb.git
          git fetch upstream main
          git checkout main

          # 1. ओरिजिनल Repo से सारे नए कोड, स्क्रिप्ट्स और कॉन्फ़िग्स लाएगा
          git checkout upstream/main -- .

          # 2. Permission Reject एरर से बचने के लिए Workflows फ़ोल्डर सुरक्षित रखेगा
          git checkout HEAD -- .github/workflows/ || true

          # 3. नया कोड कमिट करके पुश कर देगा
          git commit -m "Sync upstream code, scripts and configs [skip ci]" || true
          git push origin main
